services:
  db:
    image: pgvector/pgvector:pg17
    container_name: latrovu-db
    environment:
      POSTGRES_USER: latrovu
      POSTGRES_PASSWORD: ${LATROVU_DB_PASSWORD:-devonly}
      POSTGRES_DB: latrovu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: latrovu-rabbitmq
    hostname: latrovu-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: latrovu
      RABBITMQ_DEFAULT_PASS: ${LATROVU_RABBITMQ_PASSWORD:-devonly}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq

volumes:
  pgdata:
  rabbitmqdata:
