name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/latrovu

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --nologo

  images:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: docker/app/Dockerfile
            project: Latrovu.Hosts.Web
          - name: intake
            dockerfile: docker/app/Dockerfile
            project: Latrovu.Hosts.Intake
          - name: extraction
            dockerfile: docker/app/Dockerfile
            project: Latrovu.Hosts.Extraction
          - name: scheduler
            dockerfile: docker/app/Dockerfile
            project: Latrovu.Hosts.Scheduler
          - name: caddy
            dockerfile: docker/caddy/Dockerfile
            project: ""
          - name: postgres
            dockerfile: docker/postgres/Dockerfile
            project: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.name == 'postgres' && 'docker/postgres' || '.' }}
          file: ${{ matrix.dockerfile }}
          build-args: PROJECT=${{ matrix.project }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:main
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
